<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>針孔成像｜互動光學實驗室</title>
<style>
:root{--bg:#07131f;--panel:#0d2130e8;--line:#295064;--ink:#e7f5f4;--muted:#8da9b5;--cyan:#75e7e1;--amber:#ffd166;--coral:#ff806f;--shadow:0 24px 70px #0008}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at 10% -10%,#1c5360 0,#0c2634 34%,#07131f 80%);overflow-x:hidden}.app{max-width:1460px;margin:auto;padding:28px 30px 22px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--cyan);font-weight:800}.title{font-size:clamp(30px,4vw,50px);line-height:1;margin:8px 0 10px;letter-spacing:-.055em}.subtitle{margin:0;color:var(--muted);font-size:14px}.status{border:1px solid #3a6874;border-radius:999px;background:#133242aa;color:#bff8f3;padding:9px 14px;font-size:12px;white-space:nowrap}.layout{display:grid;grid-template-columns:292px 1fr;gap:18px}.card,.stage{border:1px solid #39607466;background:linear-gradient(145deg,#0d2331f2,#0a1a28e8);box-shadow:var(--shadow);border-radius:22px}.controls{padding:19px}.section{padding-bottom:19px;margin-bottom:18px;border-bottom:1px solid #28506466}.section:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px;letter-spacing:.13em;color:#9db8c3;font-weight:800}.number{font-variant-numeric:tabular-nums;color:var(--amber);letter-spacing:0}.control{margin:13px 0}.control-row{display:flex;justify-content:space-between;font-size:13px;color:#d5e7e9;margin-bottom:8px}.range{width:100%;accent-color:var(--cyan);cursor:pointer}.tip{margin-top:12px;padding:13px 14px;border-radius:14px;background:#74e7e10d;border:1px solid #75e7e130;color:#a9c8d0;font-size:12px;line-height:1.7}.tip strong{color:var(--cyan)}.stage{min-width:0;overflow:hidden}.stage-head{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #31566977}.stage-title{font-weight:800}.stage-title span{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}.actions{display:flex;gap:7px}.actions button{border:1px solid #426476;background:#102b3a;color:#d6eeee;border-radius:9px;padding:7px 11px;cursor:pointer}.actions button:hover{border-color:var(--cyan);color:var(--cyan)}svg{display:block;width:100%;height:auto;background:linear-gradient(180deg,#0c2330,#071621)}.legend{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid #31566977;color:#9eb5bd;font-size:12px}.key{display:flex;gap:7px;align-items:center}.swatch{width:27px;height:3px;border-radius:3px}.formula{margin-left:auto;color:#d9f0ee;font-family:ui-monospace,monospace;font-size:12px}.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.metric{padding:11px 12px;background:#0b1b28;border:1px solid #2d5363;border-radius:12px}.metric label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.metric strong{font-size:17px;color:var(--amber);font-variant-numeric:tabular-nums}.footer{display:flex;justify-content:space-between;padding:14px 3px 0;color:#6f8a95;font-size:11px}.hint{color:var(--coral)}
@media(max-width:900px){.app{padding:16px 12px}.layout{grid-template-columns:1fr}.controls{order:2}.stage{order:1}.top{display:block}.status{display:inline-block;margin-top:13px}.formula{width:100%;margin-left:0}}
</style></head>
<body><main class="app">
<header class="top"><div><div class="eyebrow">OPTICS LAB · PINHOLE CAMERA</div><h1 class="title">針孔成像</h1><p class="subtitle">拖曳蠟燭、針孔與紙屏，觀察光線如何交叉並形成倒立影像。</p></div><div class="status">● 實驗進行中</div></header>
<div class="layout"><aside class="card controls">
<section class="section"><div class="section-title"><span>實驗參數</span><span class="number">LIVE</span></div>
<label style="display:flex;gap:9px;align-items:center;color:#c9dfe2;font-size:13px"><input id="showRays" type="checkbox" checked> 顯示主要光線</label><label style="display:flex;gap:9px;align-items:center;color:#c9dfe2;font-size:13px;margin-top:10px"><input id="showGrid" type="checkbox" checked> 顯示實驗網格</label></section>
<section class="section"><div class="section-title"><span>操作指南</span><span style="color:var(--coral)">01—03</span></div><div class="tip" style="margin:0"><strong>① 移動蠟燭</strong><br>拖曳左側蠟燭，改變物距。</div><div class="tip"><strong>② 移動針孔</strong><br>拖曳中間的針孔板。</div><div class="tip"><strong>③ 移動紙屏</strong><br>拖曳右側紙屏，尋找最清晰影像。</div></section>
<section><div class="section-title"><span>觀察重點</span><span class="hint">TRY IT</span></div><p style="color:#a9c1c8;font-size:12px;line-height:1.75;margin:0">燭火與針孔保持同高，從燭火各點出發的光線沿直線前進，穿過針孔後在紙屏形成上下、左右皆相反的影像。</p></section></aside>
<section class="stage"><div class="stage-head"><div class="stage-title">光線追跡 <span>Pinhole camera simulation</span></div><div class="actions"><button id="reset">↺ 重設</button><button id="zoomOut">−</button><button id="zoomIn">＋</button></div></div><svg id="scene" viewBox="0 0 1120 610" aria-label="針孔成像互動實驗圖"></svg><div class="legend"><span class="key"><i class="swatch" style="background:var(--amber)"></i>光線</span><span class="key"><i class="swatch" style="background:var(--coral)"></i>影像輪廓</span><span class="key"><i class="swatch" style="background:var(--cyan)"></i>光軸</span><span class="formula" id="formula"></span></div></section></div>
<div class="readout"><div class="metric"><label>物距 dₒ</label><strong id="objDist"></strong></div><div class="metric"><label>屏距 dᵢ</label><strong id="screenDist"></strong></div><div class="metric"><label>影像高度 hᵢ</label><strong id="imageHeight"></strong></div></div><div class="footer"><span>近軸光線模型 · 適合課堂示範與概念探索</span><span>單一 HTML · 離線可用</span></div></main>
<script>
const NS='http://www.w3.org/2000/svg',svg=document.querySelector('#scene'),state={candle:190,pinhole:555,screen:850,rays:true,grid:true,zoom:1},axis=335;
function el(t,a={},s=''){const n=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);if(s)n.textContent=s;svg.appendChild(n);return n}function line(x1,y1,x2,y2,c='',dash=''){return el('line',{x1,y1,x2,y2,class:c,'stroke-dasharray':dash})}function path(d,c){return el('path',{d,class:c,fill:'none'})}function text(x,y,s,c=''){return el('text',{x,y,class:c,'text-anchor':'middle'},s)}
function defs(){const d=document.createElementNS(NS,'defs');d.innerHTML='<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="paper" x1="0" x2="1"><stop stop-color="#f2f0dc"/><stop offset=".5" stop-color="#fffbea"/><stop offset="1" stop-color="#c7cabd"/></linearGradient><linearGradient id="wood"><stop stop-color="#81533b"/><stop offset=".5" stop-color="#c18357"/><stop offset="1" stop-color="#6b4031"/></linearGradient>';svg.appendChild(d)}
function render(){svg.innerHTML='';const dO=state.pinhole-state.candle,dI=state.screen-state.pinhole,scale=dI/dO,flameH=52,imgH=flameH*scale;defs();if(state.grid){for(let x=40;x<1100;x+=50)line(x,55,x,575,'grid');for(let y=60;y<580;y+=50)line(25,y,1095,y,'grid')}line(30,axis,1090,axis,'axis');for(let x=50;x<1090;x+=50)line(x,axis-4,x,axis+4,'tick');drawCandle(state.candle);drawPinhole(state.pinhole);drawScreen(state.screen);if(state.rays)drawRays(imgH);drawLabels(dO,dI,imgH);updateReadout(dO,dI,imgH)}
function flamePath(){return 'M0 26 C-18 23 -14 11 -5 2 C-6 -9 7 -16 0 -26 C18 -13 15 2 8 10 C18 19 11 26 0 26Z'}
function drawCandle(x){const g=el('g',{transform:`translate(${x},0)`,class:'draggable'});g.innerHTML=`<rect x="-15" y="${axis+10}" width="30" height="58" rx="4" fill="url(#wood)"/><path d="M-10 ${axis+10}V${axis+2} Q0 ${axis-5} 10 ${axis+2}V${axis+10}" fill="#ff9b58"/><path d="${flamePath()}" transform="translate(0,${axis})" fill="#ff725e" filter="url(#glow)"/><path d="M0 6 C-7 1 3 -1 1 -13 C10 -2 8 5 0 6" transform="translate(0,${axis})" fill="#fff3ab"/>`;line(x,axis+10,x,axis+68,'stem');line(x-14,axis+68,x+14,axis+68,'base')}
function drawPinhole(x){el('rect',{x:x-13,y:80,width:26,height:480,rx:4,fill:'#2a3a48',stroke:'#80a5ad','stroke-width':2});el('rect',{x:x-10,y:90,width:20,height:460,fill:'#101d28'});el('circle',{cx:x,cy:axis,r:3,fill:'#050b10',stroke:'#ffd166','stroke-width':2,filter:'url(#glow)'});text(x,60,'針孔（同高）','label')}
function drawScreen(x){el('rect',{x:x-10,y:70,width:20,height:490,rx:3,fill:'url(#paper)',stroke:'#dce3d7','stroke-width':2});line(x-5,78,x-5,552,'paperLine');text(x,60,'紙屏','label')}
function drawRays(imgH){const flameTop=axis-26,flameBottom=axis+26,scale=(state.screen-state.pinhole)/(state.pinhole-state.candle),screenTop=axis-26*scale,screenBottom=axis+26*scale;path(`M${state.candle} ${flameTop} L${state.pinhole} ${axis} L${state.screen} ${screenBottom}`,'ray');path(`M${state.candle} ${flameBottom} L${state.pinhole} ${axis} L${state.screen} ${screenTop}`,'ray');drawImage(state.screen,scale)}
function drawImage(x,scale){const g=el('g',{transform:`translate(${x},${axis}) scale(${scale}) rotate(180)`,class:'image'});g.innerHTML=`<path d="${flamePath()}"/><path d="M0 6 C-7 1 3 -1 1 -13 C10 -2 8 5 0 6" fill="#ffdca0"/>`}
function drawLabels(dO,dI,imgH){text(state.candle,axis+88,'蠟燭（燭火中心與針孔同高）','label');text(state.candle,axis+105,'可拖曳','small');text((state.candle+state.pinhole)/2,axis+27,`物距 dₒ = ${Math.round(dO)} px`,'measure');text((state.pinhole+state.screen)/2,axis+27,`屏距 dᵢ = ${Math.round(dI)} px`,'measure');text(state.screen,axis+88,'燭火倒立影像','label');text(state.screen,axis+105,`高 ${Math.round(imgH)} px`,'small')}
function updateReadout(dO,dI,imgH){document.querySelector('#objDist').textContent=Math.round(dO)+' px';document.querySelector('#screenDist').textContent=Math.round(dI)+' px';document.querySelector('#imageHeight').textContent=Math.round(imgH)+' px';document.querySelector('#formula').textContent=`物距 ${Math.round(dO)} px　→　屏距 ${Math.round(dI)} px　→　倒立 ×${(dI/dO).toFixed(2)}`}
const style=document.createElement('style');style.textContent='.grid{stroke:#1b3b49;stroke-width:1;opacity:.45}.axis{stroke:#75e7e1;stroke-width:2;opacity:.8}.tick{stroke:#75e7e1;opacity:.5}.stem{stroke:#ffab62;stroke-width:2;stroke-dasharray:4 5}.base{stroke:#ffb167;stroke-width:4}.ray{stroke:#ffd166;stroke-width:3;filter:url(#glow)}.raySoft{stroke:#ffd166;stroke-width:2;opacity:.5;filter:url(#glow)}.image{fill:#ff806f33;stroke:#ff806f;stroke-width:2;filter:url(#glow)}.imageLine{stroke:#ff806f;stroke-width:3}.paperLine{stroke:#a0aa9f;stroke-width:2;opacity:.35}.label{fill:#dff3f1;font-size:14px;font-weight:800}.small{fill:#8ca8b1;font-size:12px}.measure{fill:#a9cdd0;font-size:12px}.draggable{cursor:grab}.draggable:active{cursor:grabbing}';document.head.appendChild(style);
document.querySelector('#showRays').onchange=e=>{state.rays=e.target.checked;render()};document.querySelector('#showGrid').onchange=e=>{state.grid=e.target.checked;render()};document.querySelector('#reset').onclick=()=>{Object.assign(state,{candle:190,pinhole:555,screen:850,zoom:1});render()};document.querySelector('#zoomIn').onclick=()=>{state.zoom=Math.min(1.2,state.zoom+.08);svg.style.transform=`scale(${state.zoom})`};document.querySelector('#zoomOut').onclick=()=>{state.zoom=Math.max(.86,state.zoom-.08);svg.style.transform=`scale(${state.zoom})`};
let drag=null;svg.addEventListener('pointerdown',e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());if(Math.abs(q.x-state.candle)<32)drag='candle';else if(Math.abs(q.x-state.pinhole)<28)drag='pinhole';else if(Math.abs(q.x-state.screen)<28)drag='screen';if(drag)svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());if(drag==='candle')state.candle=Math.max(70,Math.min(state.pinhole-70,q.x));if(drag==='pinhole')state.pinhole=Math.max(state.candle+70,Math.min(state.screen-70,q.x));if(drag==='screen')state.screen=Math.max(state.pinhole+70,Math.min(1040,q.x));render()});svg.addEventListener('pointerup',()=>drag=null);render();
</script></body></html>
